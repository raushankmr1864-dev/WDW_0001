<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <form action="#" method="post">
    <h1>Hotel Room Booking Form</h1>

    <label for="Full Name"> Full Name :</label>
    <input type="text" id="Full Name" name="Full Name" required>
    <br><br>

    <label for="email">Email:</label>
    <input type="email" id="email" name="email" required>
    <br><br>
    
    <label for="number">Phone :</label>
    <input type="number" id="number" name="number" required>
    <br><br>

    <label for="start date">Check-in Date:</label>
    <input type="date" id=" start date" name="start date" required> 
    <br><br>

    <label for="end date">Check-out Date:</label>
    <input type="date" id="end date" name="end date" required>
    <br><br>

    <label for="roomtype">Room Type:</label>
    <select id="roomtype">
        <option value="">select room type</option>
        <option value="single">single room type</option>
        <option value="Double">Double room type</option>
    </select>
    <br><br>

    <label for="Number of Guests">Number of Guests:</label>
    <input type="number" id="Number of Guests" name="Number of Guests" required>
    <br><br>

    <label for="Special Requests">Special Requests:</label><br>
    <textarea name="special requests" rows="4" cols="40" id="Special Requests" name="Special Requests" required></textarea>
<br><br>

    <input type="submit" value="Book Now">
    <input  type="reset" value="Reset Form">

    </form>  
   
</body>
</html>
