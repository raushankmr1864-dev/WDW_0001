<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<form action="#" method="post">
<h1 align="center">Student Registration Form </h1>  
<hr>
<label for="Full Name">Full Name:</label>
<input type="text" id="Full Name" name="Full Name" placeholder="Enter your full name" required>
<br><br>

<label for="email">Email:</label>
<input type="email" id="email" placeholder="Enter valid email address" required>
<br><br>

<label for="Password">Password:</label>
<input type="password" id="password" placeholder="Enter Password" required>
<br><br>

<label for="Gender">Gender:</label>
<input type="radio" id="Male" name="Gender" value="Male" required>
<label for="Male">Male</label>
<input type="radio" id="Female" name="Gender" value="Female" required>
<label for="Female">Female</label>
<input type="radio" id="Other" name="Gender" value="Other" required>
<label for="Other">Other</label>
<br><br>

<label for="-Course">Course:</label>
<select id="Course" required>
<option value=" ">--Select Course--</option>
<option value="B-tech">B-tech</option>
<option value="MBA">MBA</option>
<option value="BCA">BCA</option>
</select>
<br><br>

<label for="Contact No">Contact No:</label>
<input type="number" id="Contact No" placeholder="Enter Phone Number" required>
<br><br>

<label for="Address">Address:</label><br>
<textarea name="Address" rows="4" cols="40" id="Address" placeholder="Enter your Address" required></textarea>
<br><br>

<input type="Submit" Value="Register">
<input type="Reset" value="Clear">
    </form>
    
</body>
</html>
